name: Awkward line break / 어색한 줄바꿈
description: Share a sentence and the more natural layout you expected.
title: "Wrapping: "
body:
  - type: textarea
    id: input
    attributes:
      label: Input sentence / 입력 문장
    validations:
      required: true
  - type: input
    id: settings
    attributes:
      label: Settings / 설정
      description: maxWidth, maxLines; browser font and pixel width if applicable.
      value: "maxWidth=30, maxLines=3"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual lines / 현재 결과
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Desired lines / 원하는 줄바꿈
      render: text
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why this grouping reads better / 의미 구분 설명
